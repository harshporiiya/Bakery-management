<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Profile | Sweet Delight Bakery</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <nav class="navbar glass-panel">
    <a href="/" class="nav-brand">🍰 Sweet <span>Delight</span></a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/#menu-section">Menu</a></li>
      <li><a href="/pages/profile.html" class="active">My Profile</a></li>
      <li class="mobile-nav-user-item">
        <div id="mobile-nav-user-actions" class="mobile-nav-user-section"></div>
      </li>
    </ul>
    <div class="nav-actions">
      <button onclick="toggleTheme()" class="theme-toggle-btn" id="theme-toggle-btn">🌙</button>
      <a href="/pages/cart.html" class="cart-icon-btn">
        🛒 <span class="cart-badge" id="cart-badge">0</span>
      </a>
      <div id="nav-user-actions"></div>
      <button class="nav-toggle-btn" id="mobile-menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    </div>
  </nav>

  <div class="profile-layout-container">
    
    <!-- Top Customer Profile & Points Summary -->
    <div class="glass-panel profile-sidebar-card" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 18px 20px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <img id="user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" style="width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2.5px solid var(--gold-accent); flex-shrink: 0;">
        <div>
          <h3 id="user-name" class="font-heading" style="font-size: 1.25rem; line-height: 1.2;">Customer Name</h3>
          <p id="user-email" style="font-size: 0.82rem; color: var(--text-light); margin-top: 2px;">customer@example.com</p>
        </div>
      </div>

      <div style="background: var(--light-gold); padding: 8px 16px; border-radius: var(--radius-sm); text-align: center;">
        <div style="font-size: 0.7rem; font-weight: 700; color: #8B4513;">REWARD POINTS</div>
        <div id="user-points" style="font-size: 1.3rem; font-weight: 800; color: var(--gold-accent);">🏆 50 Pts</div>
      </div>
    </div>

    <!-- Right Column: Active Orders & Live Timeline -->
    <div class="glass-panel profile-orders-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px;">
        <h2 class="font-heading" style="font-size: 1.4rem;">Your Orders & Live Tracking 🚚</h2>
        <span style="font-size: 0.78rem; color: #27AE60; font-weight: 700; display: flex; align-items: center; gap: 6px; background: rgba(39, 174, 96, 0.1); padding: 4px 10px; border-radius: 50px;">
          <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #27AE60;"></span>
          Live Socket Updates
        </span>
      </div>
      <div id="my-orders-container">
        <!-- Dynamic Orders List -->
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/socket-client.js"></script>
  <script>
    const orderSteps = ['Pending', 'Preparing', 'Baking', 'Packed', 'Out for Delivery', 'Delivered'];

    async function loadUserProfile() {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = '/pages/login.html';
        return;
      }

      const nameElem = document.getElementById('user-name');
      const emailElem = document.getElementById('user-email');
      const pointsElem = document.getElementById('user-points');
      if (nameElem) nameElem.textContent = user.name || 'Customer';
      if (emailElem) emailElem.textContent = user.email || '';
      if (pointsElem) pointsElem.textContent = `🏆 ${user.rewardPoints || 50} Pts`;
    }

    async function loadMyOrdersList() {
      const container = document.getElementById('my-orders-container');
      if (!container) return;

      try {
        const token = getAuthToken();
        const res = await fetch('/api/orders/my-orders', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (data.success && data.orders.length > 0) {
          container.innerHTML = data.orders.map(order => {
            const currentStepIdx = orderSteps.indexOf(order.orderStatus);
            const addressText = order.shippingAddress && (order.shippingAddress.street || order.shippingAddress.city)
              ? `${order.shippingAddress.street ? order.shippingAddress.street + ', ' : ''}${order.shippingAddress.city || ''} ${order.shippingAddress.zip ? '- ' + order.shippingAddress.zip : ''}`
              : 'Ahmedabad, 380001';

            return `
              <div class="order-history-card">
                <div class="order-card-header">
                  <div>
                    <h3 style="font-size: 1.05rem; color: var(--text-primary); line-height: 1.3;">Order #${order.orderNumber}</h3>
                    <div style="font-size: 0.76rem; color: var(--text-light); margin-top: 2px;">📅 ${new Date(order.createdAt).toLocaleString('en-IN')}</div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <span style="padding: 5px 12px; border-radius: 50px; background: var(--gold-accent); color: #FFF; font-weight: 700; font-size: 0.78rem; box-shadow: 0 2px 8px rgba(212,175,55,0.35);">
                      ${order.orderStatus}
                    </span>
                    <a href="/api/orders/invoice/${order._id}" target="_blank" class="btn btn-outline btn-sm" style="padding: 5px 10px; font-size: 0.78rem;">
                      📄 Bill
                    </a>
                  </div>
                </div>

                <!-- Delivery Address on file for this order -->
                <div style="margin: 10px 0 12px 0; padding: 8px 12px; background: rgba(212, 175, 55, 0.08); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; word-break: break-word;">
                  <span>📍</span>
                  <span>Delivering to: <strong style="color: var(--text-primary);">${addressText}</strong></span>
                </div>

                <!-- Order Timeline Stepper -->
                <div class="timeline-wrapper">
                  <div class="timeline-stepper">
                    ${orderSteps.map((step, idx) => {
                      const isDone = idx <= currentStepIdx;
                      const isActive = idx === currentStepIdx;
                      return `
                        <div class="timeline-step ${isDone ? 'completed' : ''} ${isActive ? 'active' : ''}">
                          <div class="step-circle">${isDone && !isActive ? '✓' : (idx + 1)}</div>
                          <span class="step-title">${step}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- Ordered Items List -->
                <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 12px;">
                  ${order.items.map(item => {
                    const origPrice = item.originalPrice !== undefined ? item.originalPrice : item.price;
                    const discPercent = item.discount || 0;
                    return `
                      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.86rem; margin-bottom: 6px; flex-wrap: wrap; gap: 4px;">
                        <span>${item.name} (${item.weight}) <span style="color: var(--text-light); font-weight: 600;">x${item.quantity}</span> ${discPercent > 0 ? `<span style="color: #E74C3C; font-size: 0.72rem; font-weight: 700; background: rgba(231,76,60,0.1); padding: 1px 4px; border-radius: 3px;">${discPercent}% OFF</span>` : ''}</span>
                        <span style="white-space: nowrap;">
                          ${discPercent > 0 ? `<span style="text-decoration: line-through; color: var(--text-light); font-size: 0.78rem; margin-right: 4px;">₹${(origPrice * item.quantity).toFixed(2)}</span>` : ''}
                          <strong style="color: var(--text-primary);">₹${(item.price * item.quantity).toFixed(2)}</strong>
                        </span>
                      </div>
                    `;
                  }).join('')}
                  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1.02rem; font-weight: 800; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color); color: var(--gold-accent); flex-wrap: wrap; gap: 4px;">
                    <span>Grand Total Paid</span>
                    <span style="white-space: nowrap;">₹${order.grandTotal.toFixed(2)} <small style="font-size: 0.75rem; color: var(--text-light); font-weight: 600;">(${order.paymentMethod})</small></span>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--text-light);">
              <h3>No past orders found</h3>
              <p style="margin-top: 8px;">Order fresh cakes today and track their baking process in real-time!</p>
              <a href="/" class="btn btn-gold" style="margin-top: 16px;">Explore Bakery Menu</a>
            </div>
          `;
        }
      } catch (err) {
        console.error('Error fetching customer orders:', err);
      }
    }

    const profileForm = document.getElementById('profile-update-form');
    if (profileForm) {
      profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('prof-phone')?.value;
        const street = document.getElementById('prof-street')?.value;
        const city = document.getElementById('prof-city')?.value;
        const zip = document.getElementById('prof-zip')?.value;

        const token = getAuthToken();
        const res = await fetch('/api/auth/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ phone, street, city, zip })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Address & Account details saved!');
          localStorage.setItem('bakery_user', JSON.stringify(data.user));
        }
      });
    }

    window.loadMyOrdersList = loadMyOrdersList;

    document.addEventListener('DOMContentLoaded', () => {
      loadUserProfile();
      loadMyOrdersList();
    });
  </script>
</body>
</html>
